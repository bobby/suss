name: prototype-baseline
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: prototype-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2

jobs:
  test:
    runs-on: ubuntu-latest
    # The expanded suite reached the 60-minute job cap with tests still running.
    # Keep a bounded allowance for the complete baseline and cache cleanup.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify upstream inventory and scanner
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/cljs_inventory.py --check
          python3 scripts/cljs_reviews.py
          python3 scripts/core_import.py --check
          python3 scripts/reader_core_catalog.py --check
          python3 scripts/apply_bootstrap.py --check
          python3 scripts/sequence_provenance.py
          python3 scripts/bitwise_provenance.py
          python3 scripts/wasi_lock.py
          python3 scripts/numeric_runtime.py --check
          python3 scripts/publish_roadmap.py
      - name: Reproduce and execute versioned bootstrap without Java
        run: scripts/verify-bootstrap.sh
      - name: Test prototype, strict conformance baseline and runtime probe
        run: cargo test --workspace --locked -- --test-threads=2
