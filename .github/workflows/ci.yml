name: prototype-baseline
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: prototype-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tests
      - name: Verify upstream inventory and scanner
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/cljs_inventory.py --check
          python3 scripts/cljs_reviews.py
          python3 scripts/core_import.py --check
          python3 scripts/reader_core_catalog.py --check
          python3 scripts/apply_bootstrap.py --check
          python3 scripts/sequence_provenance.py
          python3 scripts/check_transducer_provenance.py
          python3 scripts/check_when_let_provenance.py
          python3 scripts/bitwise_provenance.py
          python3 scripts/wasi_lock.py
          python3 scripts/numeric_runtime.py --check
          python3 scripts/clojure_test_suite.py
          python3 scripts/clojure_test_suite.py overlap
      - name: Reproduce and execute versioned bootstrap without Java
        env:
          SUSS_BOOTSTRAP_DIAGNOSTICS_DIR: ${{ runner.temp }}/suss-bootstrap-reproduction
        run: scripts/verify-bootstrap.sh
      - name: Retain generated bootstrap diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-reproduction-${{ github.sha }}
          path: ${{ runner.temp }}/suss-bootstrap-reproduction
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 1
      - name: Test examples and documentation
        run: |
          cargo test --workspace --locked --examples -- --test-threads=2
          cargo test --workspace --locked --doc -- --test-threads=2

  # Library/binary unit tests by exact name, every test in exactly one shard.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tests
      - name: Execute this partition of every library and binary unit test
        run: python3 scripts/ci_test_shards.py --unit --count 4 --index ${{ matrix.shard }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tests
      - name: Execute complete integration suites in this partition
        run: python3 scripts/ci_test_shards.py --count 8 --index ${{ matrix.shard }}

  # Preserve the required check name; skipped/cancelled partitions cannot pass it.
  test:
    if: always()
    needs: [foundation, unit, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$FOUNDATION_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success
