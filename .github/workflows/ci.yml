name: prototype-baseline
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: prototype-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tests
      - name: Verify upstream inventory and scanner
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/cljs_inventory.py --check
          python3 scripts/cljs_reviews.py
          python3 scripts/core_import.py --check
          python3 scripts/reader_core_catalog.py --check
          python3 scripts/apply_bootstrap.py --check
          python3 scripts/sequence_provenance.py
          python3 scripts/check_transducer_provenance.py
          python3 scripts/check_when_let_provenance.py
          python3 scripts/bitwise_provenance.py
          python3 scripts/wasi_lock.py
          python3 scripts/numeric_runtime.py --check
          python3 scripts/clojure_test_suite.py
          python3 scripts/clojure_test_suite.py overlap
      - name: Reproduce and execute versioned bootstrap without Java
        run: scripts/verify-bootstrap.sh
      - name: Restore compiled core images
        uses: actions/cache/restore@v4
        with:
          path: target/suss/cache/v1/native-module
          key: suss-native-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-foundation-${{ github.run_id }}
          restore-keys: |
            suss-native-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-foundation-
            suss-native-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Test libraries, binaries, examples and documentation
        run: |
          cargo test --workspace --locked --lib --bins --examples -- --test-threads=2
          cargo test --workspace --locked --doc -- --test-threads=2
      # Keep only the large native modules (the runtime and core images, which
      # every test program shares); per-form modules and components are cheap
      # to rebuild and would make the cache several GB (#403). Entries are keyed
      # by module bytes and wasmtime's compatibility hash, so a stale entry is
      # only a miss. A cancelled job, or one that left nothing, saves nothing, so
      # it can't shadow a useful entry.
      - name: Keep only large compiled modules
        if: ${{ !cancelled() }}
        run: find target/suss/cache/v1/native-module -type f -size -1M -delete 2>/dev/null || true
      - name: Save compiled core images
        if: ${{ !cancelled() && hashFiles('target/suss/cache/v1/native-module/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: target/suss/cache/v1/native-module
          key: suss-native-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-foundation-${{ github.run_id }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-tests
      - name: Restore compiled core images
        uses: actions/cache/restore@v4
        with:
          path: target/suss/cache/v1/native-module
          key: suss-native-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-shard${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            suss-native-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-shard${{ matrix.shard }}-
            suss-native-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
      - name: Execute complete integration suites in this partition
        run: python3 scripts/ci_test_shards.py --count 8 --index ${{ matrix.shard }}
      # Keep only the large native modules (the runtime and core images, which
      # every test program shares); per-form modules and components are cheap
      # to rebuild and would make the cache several GB (#403). Entries are keyed
      # by module bytes and wasmtime's compatibility hash, so a stale entry is
      # only a miss. A cancelled job, or one that left nothing, saves nothing, so
      # it can't shadow a useful entry.
      - name: Keep only large compiled modules
        if: ${{ !cancelled() }}
        run: find target/suss/cache/v1/native-module -type f -size -1M -delete 2>/dev/null || true
      - name: Save compiled core images
        if: ${{ !cancelled() && hashFiles('target/suss/cache/v1/native-module/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: target/suss/cache/v1/native-module
          key: suss-native-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-shard${{ matrix.shard }}-${{ github.run_id }}

  # Preserve the required check name; skipped/cancelled partitions cannot pass it.
  test:
    if: always()
    needs: [foundation, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$FOUNDATION_RESULT" = success
          test "$INTEGRATION_RESULT" = success
