[package]
name = "suss-mlir-bridge-draft"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
suss-compile = { path = "../../../crates/suss-compile" }
suss-reader = { path = "../../../crates/suss-reader" }
wasmtime = "=49.0.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
wasm-encoder = "=0.258.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.test.package."*"]
opt-level = 2
debug-assertions = true
overflow-checks = true
