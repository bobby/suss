[package]
name = "suss-compile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Static compiler for Suss - compiles to WASM components"

[dependencies]
suss-core = { workspace = true }
suss-reader = { path = "../suss-reader" }
num-traits = { workspace = true }
wasm-encoder = { workspace = true }
wasmparser = { workspace = true }
wit-parser = { workspace = true }
wit-component = { workspace = true }
thiserror = { workspace = true }
stacker = "=0.1.22"
xxhash-rust = { version = "0.8.15", features = ["xxh32"] }
sha2 = "=0.10.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
sha2 = "=0.10.9"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
wasmtime = { workspace = true }

[dev-dependencies]
wasmtime = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
# Test-only: reads Wasmtime's exact post-collection live byte record.
log = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "performance"
harness = false
