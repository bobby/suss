[package]
name = "suss-reader"
version.workspace = true
edition.workspace = true
license.workspace = true

# An rlib only (#383): with a cdylib too, Cargo names the rlib without a
# metadata hash, so suss-compile-generator's host build of this crate (a
# build dependency of suss-compile) and the ordinary build overwrite each
# other. Build the reader component with `cargo rustc --crate-type cdylib`.
[lib]
crate-type = ["rlib"]

[dependencies]
suss-core = { workspace = true }
chumsky = { workspace = true }
ariadne = { workspace = true }
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-integer = { workspace = true }
num-traits = { workspace = true }
stacker = "=0.1.22"
serde = "1"
wit-bindgen = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde = { version = "1", features = ["derive"] }

[features]
default = []
component = ["dep:wit-bindgen", "suss-core/component"]
